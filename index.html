<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML CSS Layout Practice</title>
    <meta name="description"
        content="Portfolio of HTML and CSS layout practice projects. Explore Jira, Flipkart, dashboard, and grid layouts with live previews and GitHub repositories.">
    <link rel="stylesheet" href="/styles.css">
</head>

<body>

    <header class="header">
        <h1>HTML CSS Layout Practice</h1>
        <p>Collection of layouts created during practice</p>
    </header>

    <main class="container">

        <div class="card-grid">

            <div class="card">
                <img src="images/Jira.png" alt="Jira Layout">

                <div class="card-content">
                    <h3>Jira</h3>

                    <div class="card-buttons">
                        <a href="https://layout-jira.vercel.app/" target="_blank" class="btn preview">
                            Preview
                        </a>

                        <a href="https://github.com/kushal-zinzuvadia-simform/layout-jira/tree/dev" target="_blank"
                            class="btn github">
                            GitHub
                        </a>
                    </div>
                </div>
            </div>

            <div class="card">
                <img src="images/Flipkart.png" alt="Flipkart Layout">

                <div class="card-content">
                    <h3>Flipkart</h3>

                    <div class="card-buttons">
                        <a href="https://flipkart-layout.vercel.app/" class="btn preview" target="_blank">Preview</a>
                        <a href="https://github.com/kushal-zinzuvadia-simform/flipkart-layout/tree/dev"
                            class="btn github" target="_blank">GitHub</a>
                    </div>
                </div>
            </div>

            <div class="card">
                <img src="images/dashboard.jpg" alt="Dashboard Layout">

                <div class="card-content">
                    <h3>Dashboard Layout</h3>

                    <div class="card-buttons">
                        <a href="/dashboard/index.html" target="_blank" class="btn preview">
                            Preview
                        </a>

                        <a href="https://github.com/kushal-zinzuvadia-simform/layout-practice/tree/dev/dashboard"
                            target="_blank" class="btn github">
                            GitHub
                        </a>
                    </div>
                </div>
            </div>

            <div class="card">
                <img src="images/yellow-black.png" alt="Yellow Black grid Layout">

                <div class="card-content">
                    <h3>Yellow Black grid</h3>

                    <div class="card-buttons">
                        <a href="/yellow-black/index.html" class="btn preview" target="_blank">Preview</a>
                        <a href="https://github.com/kushal-zinzuvadia-simform/layout-practice/tree/dev/yellow-black"
                            class="btn github" target="_blank">GitHub</a>
                    </div>
                </div>
            </div>

            <div class="card">
                <img src="images/practice2.png" alt="flex Layout">

                <div class="card-content">
                    <h3>Practice Page using flex</h3>

                    <div class="card-buttons">
                        <a href="/practice2/index.html" class="btn preview" target="_blank">Preview</a>
                        <a href="https://github.com/kushal-zinzuvadia-simform/layout-practice/tree/dev/practice2"
                            class="btn github" target="_blank">GitHub</a>
                    </div>
                </div>
            </div>

            <div class="card">
                <img src="images/practice3.png" alt="Interview Practice Layout">

                <div class="card-content">
                    <h3>Interview Practice</h3>

                    <div class="card-buttons">
                        <a href="/interview-practice/index.html" class="btn preview" target="_blank">Preview</a>
                        <a href="https://github.com/kushal-zinzuvadia-simform/layout-practice/tree/dev/interview-practice"
                            class="btn github" target="_blank">GitHub</a>
                    </div>
                </div>
            </div>

            <div class="card">
                <img src="images/grid.png" alt="grid Layout">

                <div class="card-content">
                    <h3>Grid</h3>

                    <div class="card-buttons">
                        <a href="/grid/index.html" class="btn preview" target="_blank">Preview</a>
                        <a href="https://github.com/kushal-zinzuvadia-simform/layout-practice/tree/dev/grid"
                            class="btn github" target="_blank">GitHub</a>
                    </div>
                </div>
            </div>

        </div>

    </main>

</body>

</html>
