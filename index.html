<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML CSS Layout Practice</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="header">
        <h1>HTML CSS Layout Practice</h1>
        <p>Collection of layouts created during practice</p>
    </header>

    <main class="container">

        <div class="card-grid">

            <div class="card">
                <img src="images/Jira.png" alt="Jira Layout">

                <div class="card-content">
                    <h3>Jira</h3>

                    <div class="card-buttons">
                        <a href="https://layout-jira.vercel.app/" target="_blank" class="btn preview">
                            Preview
                        </a>

                        <a href="https://github.com/kushal-zinzuvadia-simform/layout-jira/tree/dev" target="_blank"
                            class="btn github">
                            GitHub
                        </a>
                    </div>
                </div>
            </div>

            <div class="card">
                <img src="images/Flipkart.png" alt="Flipkart Layout">

                <div class="card-content">
                    <h3>Flipkart</h3>

                    <div class="card-buttons">
                        <a href="https://flipkart-layout.vercel.app/" class="btn preview">Preview</a>
                        <a href="https://github.com/kushal-zinzuvadia-simform/flipkart-layout/tree/dev"
                            class="btn github">GitHub</a>
                    </div>
                </div>
            </div>

            <div class="card">
                <img src="images/dashboard.png" alt="Dashboard Layout">

                <div class="card-content">
                    <h3>Dashboard Layout</h3>

                    <div class="card-buttons">
                        <a href="#" target="_blank" class="btn preview">
                            Preview
                        </a>

                        <a href="#" target="_blank" class="btn github">
                            GitHub
                        </a>
                    </div>
                </div>
            </div>

            <div class="card">
                <img src="images/yellow-black.png" alt="Yellow Black grid Layout">

                <div class="card-content">
                    <h3>Yellow Black grid</h3>

                    <div class="card-buttons">
                        <a href="#" class="btn preview">Preview</a>
                        <a href="#" class="btn github">GitHub</a>
                    </div>
                </div>
            </div>

        </div>

    </main>

</body>

</html>
